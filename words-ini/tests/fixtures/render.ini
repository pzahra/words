; references, constants, items and escapes (Core SPEC: One pass for every brace)
value=!en
value-de=Deutsch

[app]
value=Pool Manager
[.title]
value={>app} — {>.version}
[.title.version]
value=v{$version}

[$version]
value=1.2

[a]
value=A{>.b}
[.b]
value=B{>.c}
[.b.c]
value=C

[loop]
value=x{>loop.back}
[.back]
value=y{>loop}

[greet]
value=Hello, {Name}!
value-de=Hallo, {Name}!

[pad]
value=[{0,5}|{0,-5}|{1}]

[missing]
value={>nowhere} {0} {3}

[escaped]
value={{0} and {{>app} and } alone

[malformed]
value=a {0,x} b {} c {

[server]
value=\\\\server\\share

[quote]
value=it''s snake__case

[lines]
value=first\
second_
 third

[$raw]
value={0} {>app}

[constant]
value={$raw}

[outer]
value={>.inner} by {Who}
[.inner]
value=made {0}
