; The seam's own words (SPEC: Import and export — loss is declared, not suffered): each
; WordsFeatures flag names its words by key, [Words("feature.x")], and this is the name.
; A host stacks its file over this one and may add the variants Describe reads — the
; editor's feature.x.sub is how its loss line phrases the feature. Declared with `!`
; labels like a format's: present, never listed by the host.
