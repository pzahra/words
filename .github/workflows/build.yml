# Publishes NuGet packages to nuget.org via Trusted Publishing (OIDC): no API key
# is stored. On each run nuget.org mints a short-lived key from this workflow's own
# identity, matched against the trusted-publishing policy bound to the repo owner,
# this repository, and this file's path (.github/workflows/build.yml).
#
# Two independent release lines, told apart by the tag prefix:
#   api/X.Y.Z       -> Core, WPF and Avalonia (one API surface, released together)
#   analyzer/X.Y.Z  -> the analyzer package, and beside it the Rider plugin
#                      (WordsXaml), at the same number, as a GitHub Release asset
#
# Versions come from Versions.props, not the tag — the tag only decides when to
# publish. Bump the props, commit, then tag that commit; the version job fails a
# tag whose number the props don't carry, before anything is built.
#
# Core/WPF/Avalonia depend on the analyzer at a version pinned by hand in
# Localization-Core.csproj (the editor and samples pin it too), not at
# AnalyzerVersion, and restore it from nuget.org only. So when the analyzer
# changed: tag analyzer/X first; once X is on nuget.org, bump the pinned
# references to X in a commit of their own; then tag api/ on that commit.
#
# Nothing is pushed unless the test suites pass on the tagged commit: publish
# needs the tests job, which runs tests.yml on that same commit.
name: build

on:
  push:
    tags:
      - 'api/[0-9]+.[0-9]+.[0-9]+'
      - 'analyzer/[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# one run per tag at a time, and a re-run never cancels one under way
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # an unbumped props would pack the last release's number, which --skip-duplicate
  # then passes as published: green, and nothing shipped
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Versions.props carries the tag's number
        run: |
          case "$GITHUB_REF_NAME" in
            api/*) property=ApiVersion ;;
            analyzer/*) property=AnalyzerVersion ;;
          esac
          props=$(dotnet msbuild Versions.props -getProperty:$property | tr -d '\r')
          if [ "$props" != "${GITHUB_REF_NAME##*/}" ]; then
            echo "::error::$GITHUB_REF_NAME, but Versions.props has $property $props: bump it, commit, and tag that commit"
            exit 1
          fi

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: windows-latest      # the WPF package targets net*-windows, so packing needs Windows
    permissions:
      contents: read
      id-token: write    # required so the runner can request the OIDC token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0         # full history, so Source Link resolves the commit

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack analyzer
        if: startsWith(github.ref, 'refs/tags/analyzer/')
        run: dotnet pack LocalizationAnalyzer/LocalizationAnalyzer.Package/LocalizationAnalyzer.Package.csproj -c Release -o artifacts

      # Core/WPF/Avalonia set GeneratePackageOnBuild for local dev, which makes a
      # bare `dotnet pack` run the pack target without building first (NU5026: the
      # output dll is missing). Turn it off here so pack builds, then packs.
      # pwsh fails a step on the last native exit code only, so each pack is
      # checked, and all three must be there before anything is pushed.
      - name: Pack API packages
        if: startsWith(github.ref, 'refs/tags/api/')
        shell: pwsh
        run: |
          foreach ($project in 'Localization-Core/Localization-Core.csproj', 'Localization-Wpf/Localization-Wpf.csproj', 'Localization-Ava/Localization-Ava.csproj') {
            dotnet pack $project -c Release -o artifacts -p:GeneratePackageOnBuild=false
            if ($LASTEXITCODE -ne 0) { throw "Pack failed for $project" }
          }
          $version = '${{ github.ref_name }}'.Split('/')[-1]
          foreach ($id in 'Core', 'WPF', 'Avalonia') {
            if (-not (Test-Path "artifacts/PatTech.Localization.$id.$version.nupkg")) { throw "PatTech.Localization.$id $version was not packed" }
          }

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: pzahra                   # nuget.org account that owns the trusted-publishing policy

      # dotnet nuget push takes a single path and does not expand a wildcard here
      # (pwsh passes it through literally), and it accepts only one package per
      # call — so enumerate and push each. --skip-duplicate lets an
      # already-published version pass, so the symbols go in a loop of their own:
      # carried by their package, a re-run would skip the package and never retry
      # symbols that failed after it landed.
      - name: Push to nuget.org
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem artifacts/*.nupkg -ErrorAction SilentlyContinue
          if (-not $pkgs) { throw "No .nupkg found in artifacts to push." }
          foreach ($pkg in $pkgs) {
            dotnet nuget push $pkg.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($pkg.Name)" }
          }
          foreach ($symbols in Get-ChildItem artifacts/*.snupkg -ErrorAction SilentlyContinue) {
            dotnet nuget push $symbols.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($symbols.Name)" }
          }

  # The Rider plugin rides the analyzer's track, at AnalyzerVersion (build.gradle.kts
  # reads it from Versions.props): a GitHub Release for the analyzer/ tag carries
  # its zip, which Rider installs from disk. The analyzer package itself goes to
  # nuget.org, in the publish job.
  plugin:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/analyzer/')
    runs-on: ubuntu-latest
    permissions:
      contents: write    # to create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0         # every tag, to find the previous analyzer/ one

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build the plugin
        working-directory: WordsXaml
        run: bash gradlew buildPlugin -PbuildConfiguration=Release --no-daemon

      # A re-run finds the release made, and uploads the zip over what an
      # interrupted upload left. Not marked Latest: that is Wordsmith's.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME##*/}"
          zip="WordsXaml/build/distributions/WordsXaml-$version.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::$zip was not built: the plugin's version is not AnalyzerVersion"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            exit
          fi
          cat > notes.md <<'EOF'
          **WordsXaml** is the Rider plugin: key completion, tooltips and an unknown-key squiggle for `{l:Words …}` in XAML, and key completion and tooltips in C# wherever a `[WordsKey]` is wanted. In Rider 2025.3 or later, install the zip with **Settings ▸ Plugins ▸ ⚙ ▸ Install Plugin from Disk…**.

          The analyzer itself is on nuget.org as `PatTech.Localization.Analyzer`, and comes along with `PatTech.Localization.Core`.
          EOF
          since=()
          previous=$(git tag --list 'analyzer/*' --sort=v:refname | grep -F -x -B1 "$GITHUB_REF_NAME" | head -n -1)
          if [ -n "$previous" ]; then since=(--notes-start-tag "$previous"); fi
          gh release create "$GITHUB_REF_NAME" "$zip" --title "Analyzer $version" --notes-file notes.md --generate-notes --latest=false "${since[@]}"
