# Builds the samples and publishes them as a GitHub Release when an api/ tag is
# pushed, beside the packages build.yml sends to nuget.org. It is a file of its
# own on purpose: nuget.org's trusted-publishing policy is bound to build.yml's
# path, and a sample that fails to build must not hold up a package push.
#
#   api/X.Y.Z  -> a GitHub Release "Words samples X.Y.Z" holding self-contained
#                 builds: Sample-Wpf for Windows; Sample-Ava and Sample-Console
#                 for Windows, Linux and macOS
#
# The samples reference Core, WPF and Avalonia as projects, so they build from
# the tagged source, the same code the packages carry. Wordsmith's releases
# share the Releases page, so this one is never marked Latest, and its notes run
# from the previous api/ tag rather than from whichever release came last.
# Run it by hand (workflow_dispatch) to build everything without releasing:
# only a pushed tag releases, so a dispatch on a tag builds and stops there too.
#
# Nothing is built or released unless the test suites pass on the commit: the
# windows job, which creates the release, needs the tests job (tests.yml), and
# the unix job follows it. A tag's number must be ApiVersion's, or the version
# job stops the run before anything is built.
name: release-samples

on:
  push:
    tags:
      - 'api/[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write        # to create the release

# one run per ref at a time, and a re-run never cancels one under way
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Versions.props carries the tag's number
        if: startsWith(github.ref, 'refs/tags/api/')
        run: |
          props=$(dotnet msbuild Versions.props -getProperty:ApiVersion | tr -d '\r')
          if [ "$props" != "${GITHUB_REF_NAME##*/}" ]; then
            echo "::error::$GITHUB_REF_NAME, but Versions.props has ApiVersion $props: bump it, commit, and tag that commit"
            exit 1
          fi

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  windows:
    needs: tests
    runs-on: windows-latest      # Sample-Wpf is WPF (net10.0-windows)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0         # every tag, to find the previous api/ one

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # api/1.5.0 -> 1.5.0, for the archive names and release title
      - name: Version from tag
        id: ver
        shell: pwsh
        run: echo "value=$('${{ github.ref_name }}'.Split('/')[-1])" >> $env:GITHUB_OUTPUT

      - name: Publish and zip
        shell: pwsh
        run: |
          foreach ($sample in 'Sample-Wpf', 'Sample-Ava', 'Sample-Console') {
            dotnet publish "$sample/$sample.csproj" -c Release -r win-x64 --self-contained true -o "publish/$sample"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $sample" }
            Compress-Archive -Path "publish/$sample/*" -DestinationPath "Words-$sample-${{ steps.ver.outputs.value }}-win-x64.zip"
          }

      # The tag already exists (it triggered this run). Latest stays Wordsmith's.
      # GitHub writes the notes, the pull requests merged and a link to the full
      # comparison, from the previous api/ tag rather than the previous release;
      # the note on the macOS builds goes above them. A re-run finds the release
      # made, and uploads every build over what an interrupted upload left.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/api/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = (Get-ChildItem Words-*.zip).FullName
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload '${{ github.ref_name }}' $zips --clobber
          }
          else {
            Set-Content notes.md -Value 'The macOS builds are signed ad hoc, not notarized, so macOS quarantines a download. Clear it once in the unpacked folder: `xattr -dr com.apple.quarantine .`'
            $tags = @(git tag --list 'api/*' --sort=v:refname)
            $i = [array]::IndexOf($tags, '${{ github.ref_name }}')
            $since = if ($i -gt 0) { @('--notes-start-tag', $tags[$i - 1]) } else { @() }
            gh release create '${{ github.ref_name }}' $zips --title 'Words samples ${{ steps.ver.outputs.value }}' --notes-file notes.md --generate-notes --latest=false @since
          }
          if ($LASTEXITCODE -ne 0) { throw "Release failed" }

  unix:
    needs: windows               # the release exists once the Windows job is done
    runs-on: ubuntu-latest       # a tar made here keeps the executable bit a Windows zip would lose
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish and pack
        run: |
          version="${GITHUB_REF_NAME##*/}"
          for sample in Sample-Ava Sample-Console; do
            for rid in linux-x64 osx-x64 osx-arm64; do
              dotnet publish "$sample/$sample.csproj" -c Release -r "$rid" --self-contained true -o "publish/$sample-$rid"
              chmod +x "publish/$sample-$rid/$sample"
              tar -czf "Words-$sample-$version-$rid.tar.gz" -C "publish/$sample-$rid" .
            done
          done

      # --clobber: a re-run replaces what an interrupted upload left
      - name: Attach to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/api/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Words-*.tar.gz --clobber
