# Builds Wordsmith and the words command line and publishes them as a GitHub
# Release when an editor/ tag is pushed. No nuget.org involvement, so no OIDC —
# just the built-in token, with permission to create the release.
#
#   editor/X.Y.Z  -> a GitHub Release holding a self-contained win-x64 Wordsmith,
#                    and words, one self-contained file, for win-x64, linux-x64,
#                    osx-x64 and osx-arm64
#
# Both take their version from WordsmithVersion in Versions.props, and the
# version job fails a tag whose number the props don't carry, before anything
# is built. They reference the analyzer package, so its AnalyzerVersion must
# already be on nuget.org before this runs.
#
# Nothing is released unless the test suites pass on the tagged commit: the
# release job needs the tests job (tests.yml on that same commit) as well as
# both builds, which run alongside the tests.
name: release-editor

on:
  push:
    tags:
      - 'editor/[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write        # to create the release

# one run per tag at a time, and a re-run never cancels one under way
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # an unbumped props would build words-1.3.0-* reporting the last release's number
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Versions.props carries the tag's number
        run: |
          props=$(dotnet msbuild Versions.props -getProperty:WordsmithVersion | tr -d '\r')
          if [ "$props" != "${GITHUB_REF_NAME##*/}" ]; then
            echo "::error::$GITHUB_REF_NAME, but Versions.props has WordsmithVersion $props: bump it, commit, and tag that commit"
            exit 1
          fi

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  wordsmith:
    needs: version
    runs-on: windows-latest      # Wordsmith is WPF (net10.0-windows)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # editor/1.1.0 -> 1.1.0, for the archive name
      - name: Version from tag
        id: ver
        shell: pwsh
        run: echo "value=$('${{ github.ref_name }}'.Split('/')[-1])" >> $env:GITHUB_OUTPUT

      - name: Publish Wordsmith
        run: dotnet publish WordsEdit/WordsEdit.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "Wordsmith-${{ steps.ver.outputs.value }}-win-x64.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: wordsmith
          path: Wordsmith-*.zip

  # Linux, so the tarballs keep the executable bit a zip made on Windows would
  # lose. The SDK signs the macOS builds ad hoc, which Apple Silicon requires to
  # run them at all; they are not notarized, so a download is quarantined.
  words:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish words
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish WordsCli/WordsCli.csproj -c Release -r "$rid" --self-contained true -o "out/$rid"
          done

      # the executable alone in each: the pdbs and docs beside it stay behind
      - name: Pack each platform
        run: |
          version="${GITHUB_REF_NAME##*/}"
          mkdir dist
          (cd out/win-x64 && zip -9 "../../dist/words-$version-win-x64.zip" words.exe)
          for rid in linux-x64 osx-x64 osx-arm64; do
            chmod +x "out/$rid/words"
            tar -czf "dist/words-$version-$rid.tar.gz" -C "out/$rid" words
          done

      - uses: actions/upload-artifact@v6
        with:
          name: words
          path: dist/*

  release:
    needs: [tests, wordsmith, words]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0         # every tag, to find the previous editor/ one

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # The tag already exists (it triggered this run), so this attaches the builds
      # to a release for it. GitHub writes the notes: the pull requests merged since
      # the previous editor/ tag and a link to the full comparison, starting there
      # because the samples' api/ releases share the page and the notes would
      # otherwise start at whichever release came last. The note on the command
      # line goes above them. Wordsmith's release is the one marked Latest.
      # A re-run finds the release made, and uploads every build over what an
      # interrupted upload left.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit
          fi
          version="${GITHUB_REF_NAME##*/}"
          cat > notes.md <<'EOF'
          **Wordsmith** is the Windows editor: unzip and run `Wordsmith.exe`.

          **words** is the command line, for scripts, build steps and coding agents on any platform: one self-contained file, nothing to install. Unpack it somewhere on your `PATH` and run `words --help`.

          The macOS builds are signed ad hoc, not notarized, so macOS quarantines a download. Clear it once: `xattr -d com.apple.quarantine words`.
          EOF
          since=()
          previous=$(git tag --list 'editor/*' --sort=v:refname | grep -F -x -B1 "$GITHUB_REF_NAME" | head -n -1)
          if [ -n "$previous" ]; then since=(--notes-start-tag "$previous"); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Wordsmith $version" --notes-file notes.md --generate-notes --latest "${since[@]}"
