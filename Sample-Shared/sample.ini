; Live switching

[live.bound-key]
value=A key the view model picks
value-it=Una chiave scelta dal view model
[.guide]
value=Wrap a binding in **{l:Words}** and its value is the key, looked up whenever it changes and again on every language switch. Flip the theme, then switch the language.
value-it=Avvolgi un binding in **{l:Words}** e il suo valore è la chiave, cercata quando cambia e di nuovo a ogni cambio di lingua. Cambia il tema, poi la lingua.
[.light]
value=The light theme is on: the view model picks this key.
value-it=È attivo il tema chiaro: il view model sceglie questa chiave.
[.dark]
value=The dark theme is on: the view model picks this key.
value-it=È attivo il tema scuro: il view model sceglie questa chiave.

[live.converted]
value=A binding with its own converter
value-it=Un binding con il suo convertitore
[.guide]
value=Wrapped in **{l:Words}**, a binding's own converter runs again on every language switch, not only when its source moves. Move the slider, then switch the language.
value-it=Avvolto in **{l:Words}**, il convertitore di un binding si riesegue a ogni cambio di lingua, non solo quando la sorgente si muove. Muovi il cursore, poi cambia la lingua.
[.demo]
value=The slider reads {0:N0}, formatted by WordsConverter
value-it=Il cursore segna {0:N0}, formattato da WordsConverter

[live.kept]
value=Kept strings go stale
value-it=Le stringhe conservate invecchiano
[.guide]
value=A string a view model composed and kept is a snapshot: it stays in the language it was made in. A view model that implements **IKnowWords** and calls **Words.Watch(this)** hears every switch and composes again. Switch the language and compare.
value-it=Una stringa che un view model ha composto e conservato è un'istantanea: resta nella lingua in cui è nata. Un view model che implementa **IKnowWords** e chiama **Words.Watch(this)** sente ogni cambio e ricompone. Cambia la lingua e confronta.
[.kept]
value=Kept: composed once, in English, at startup.
value-it=Conservata: composta una volta, in italiano, all''avvio.
[.watched]
value=Watched: composed again, in English, on every switch.
value-it=Osservata: ricomposta, in italiano, a ogni cambio.

; Diagnostics

[diagnostics.fallbacks]
value=Fallbacks, branded
value-it=Valori di ripiego, marcati
[.guide]
value=**Debug** on the builder brands every value that fell back from the language showing: 🕮 for the language family, 📚 for the default. Tick the box and the builder digests again in place, so the whole window shows it._
 Italian shows it best: English is this sample''s default, so in English no line is marked.
value-it=**Debug** sul builder marca ogni valore ripiegato dalla lingua mostrata: 🕮 per la famiglia della lingua, 📚 per il predefinito. Spunta la casella e il builder rielabora sul posto, così si vede in tutta la finestra._
 L''italiano lo mostra meglio: l''inglese è la lingua predefinita per questo esempio; pertanto, nessuna riga è contrassegnata per l''inglese.
[.toggle]
value=Brand the fallbacks
value-it=Marca i valori di ripiego
[.translated]
value=This line is translated into every language the sample offers.
value-it=Questa riga è tradotta in ogni lingua offerta dall''esempio.
[.untranslated]
value=This line has only the default value.

[diagnostics.log]
value=What Words gripes about
value-it=Di cosa si lamenta Words
[.guide]
value=Words never throws over a typo. A missing key, an unknown constant, a loop or a picture that will not load is reported to **Words.Logger**, an **ITakeException** assigned at startup; this sample keeps the list below, newest first. **{>topic.start}**, **{>topic.references}** and **{>topic.images}** each cause one on purpose.
value-it=Words non solleva mai eccezioni per un errore di battitura. Una chiave mancante, una costante sconosciuta, un giro o un'immagine che non si carica vengono segnalati a **Words.Logger**, un **ITakeException** assegnato all'avvio; questo esempio tiene l'elenco qui sotto, dal più recente. **{>topic.start}**, **{>topic.references}** e **{>topic.images}** ne causano uno apposta.
