; Enums

[enums.names]
value=An enum in Words
value-it=Un enum in Words
[.guide]
value=Mark each member **[Words(key)]** and **WordsEnumDescription** turns a bound value into its words. A member with no key falls back to its **[Description]**, then to its name: the Americano has only a Description, so it reads the same in every language.
value-it=Marca ogni membro con **[Words(chiave)]** e **WordsEnumDescription** trasforma un valore legato nelle sue parole. Un membro senza chiave ripiega sulla sua **[Description]**, poi sul nome: l'Americano ha solo una Description, quindi si legge uguale in ogni lingua.

[enums.variants]
value=Tooltip, subtitle and description
value-it=Tooltip, sottotitolo e descrizione
[.guide]
value=Beside a member's key, Describe looks for **.tooltip**, **.sub**, **.desc** and **.unit**, and the converter's parameter picks one: T, S, d or U. These follow the brew picked above; hover its name for the tooltip.
value-it=Accanto alla chiave di un membro, Describe cerca **.tooltip**, **.sub**, **.desc** e **.unit**, e il parametro del convertitore ne sceglie uno: T, S, d o U. Seguono la bevanda scelta sopra; passa sul nome per il tooltip.

[enums.flags]
value=Flags, one by one
value-it=Flag, uno per uno
[.guide]
value=For a **[Flags]** value, **WordsFlagsDescription** describes each flag that is set and joins them, and **WordsFlagsDescriptionList** hands back the list, for an items control. With none set, the zero member speaks.
value-it=Per un valore **[Flags]**, **WordsFlagsDescription** descrive ogni flag attivo e li unisce, e **WordsFlagsDescriptionList** restituisce l'elenco, per un controllo a elementi. Senza flag attivi, parla il membro zero.
