[.guide]
value=Digest formats numbers and dates the language's way, so they match the words: switch the language and watch the separators. **UseSystemNumbers** keeps the system's format while the words follow the language; the box flips it, and the builder digests again in place.
value-it=Digest formatta numeri e date alla maniera della lingua, così si accordano con le parole: cambia la lingua e guarda i separatori. **UseSystemNumbers** mantiene il formato del sistema mentre le parole seguono la lingua; la casella lo inverte, e il builder rielabora sul posto.
