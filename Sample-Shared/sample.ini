[parameters.plural]
value=Plural forms, picked by the count
value-it=Forme plurali, scelte dal numero
value-mt=Forom plurali, magħżula min-numru
[.guide]
value=The same count, worded right. A key keeps a form for each count its language tells_
 apart: **value#other** beside the value for English, **value-it#other** for Italian,_
 and Maltese, which this page also speaks, adds **#few**. In a template, **{0#key}**_
 puts in the form the count picks, by Unicode CLDR''s rule for the language, without_
 printing the count; a form may print it itself, as Maltese''s **#many** does to_
 write **11-il**. A form left out reads the one that stands in for it, as Maltese''s_
 **#two** reads its **#few**, since few Maltese words keep a dual; else the language''s_
 **#other**, else its plain value, so Italian''s **#many**, for exact millions, reads_
 **messaggi**. Move the slider above, then switch the language.
value-it=Lo stesso numero, con le parole giuste. Una chiave conserva una forma per ogni numero_
 che la sua lingua distingue: **value#other** accanto al valore per l''inglese, **value-it#other**_
 per l''italiano, e il maltese, che questa pagina parla anche, aggiunge **#few**._
 In un modello, **{0#chiave}** inserisce la forma scelta dal numero, secondo la regola_
 di Unicode CLDR per la lingua, senza stamparlo; una forma può stamparlo da sé, come_
 fa il **#many** maltese per scrivere **11-il**. Una forma omessa legge quella che_
 la sostituisce, come il **#two** maltese legge il suo **#few**, perché poche parole_
 maltesi hanno il duale; altrimenti il **#other** della lingua, altrimenti il suo_
 valore semplice, così il **#many** italiano, per i milioni esatti, legge **messaggi**._
 Muovi il cursore qui sopra, poi cambia lingua.
value-mt=L-istess numru, bil-kliem it-tajjeb. Ċavetta żżomm forma għal kull numru li l-lingwa_
 tagħha tiddistingwi: **value#other** ħdejn il-valur għall-Ingliż, **value-it#other**_
 għat-Taljan, u l-Malti jżid **#few**. F''mudell, **{0#ċavetta}** idaħħal il-forma_
 li jagħżel in-numru, skont ir-regola ta'' Unicode CLDR għall-lingwa, mingħajr ma_
 jiktbu; forma tista'' tiktbu hi stess, bħalma jagħmel il-**#many** Malti biex jikteb_
 **11-il**. Forma li titħalla barra tieħu dik li tidħol minflokha, bħalma l-**#two**_
 Malti jieħu l-**#few** tiegħu, għax ftit kliem Malti għandu d-duali; inkella l-**#other**_
 tal-lingwa, inkella l-valur sempliċi tagħha, u għalhekk il-**#many** Taljan, għall-miljuni_
 eżatti, jieħu **messaggi**. Ċaqlaq is-slider ta'' fuq, imbagħad biddel il-lingwa.
