; Words on show: every word both samples show lives in this one file.
; Each sample loads it, then its own framework.ini, which holds the two
; constants the values here reference: {$framework}, the framework's name,
; and {$embedded}, the base URI of an embedded asset. Those are the only
; words the twins do not share.
; Lines starting with `;` are comments. A value ending in `\` continues on
; the next line keeping the newline; one ending in `_` continues on the same
; line. Maltese speaks on the Format parameters page alone, for its plural
; forms; everywhere else it falls back to the English default.
