; Getting started

[start.markup]
value=Words in markup
value-it=Words nel markup
[.guide]
value=**{l:Words key}** puts a key's words into any property. A key with no words of its own in the language falls back to the default value, so a missing translation shows English rather than nothing.
value-it=**{l:Words chiave}** mette le parole di una chiave in qualsiasi proprietà. Una chiave senza parole proprie nella lingua ripiega sul valore predefinito, così una traduzione mancante mostra l'inglese invece di niente.
[.demo]
value=This line has words of its own in every language the sample offers.
value-it=Questa riga ha parole proprie in ogni lingua offerta dall'esempio.
[.fallback]
value=This line has only the default value, so every language shows it as written.

; Markdown

[markdown.styles]
value=Inline styles
value-it=Stili in linea
[.guide]
value=**WordsInline** renders a value's markdown inside a text block. Plain-string surfaces, {l:Words} among them, show the markup as typed, so keep markdown out of titles and tooltips.
value-it=**WordsInline** mostra il markdown di un valore dentro un blocco di testo. Le superfici a stringa semplice, {l:Words} tra queste, mostrano il markup così com'è, quindi tienilo fuori da titoli e tooltip.
[.demo]
comment=Every inline style the markdown dialect knows.
value=*italic*, **bold**, ***both***, E = mc^2^ and H~2~O
value-it=*corsivo*, **grassetto**, ***entrambi***, E = mc^2^ e H~2~O

[markdown.entities]
value=Entities and emoji
value-it=Entità ed emoji
[.guide]
value=HTML entities and emoji shortcodes become their characters, so a translator can type them on any keyboard.
value-it=Le entità HTML e gli shortcode delle emoji diventano i loro caratteri, così un traduttore li scrive con qualsiasi tastiera.
[.demo]
value=HTML entities &copy; &amp; &#8482; work, and so do :sparkles: emoji :rocket: shortcodes :tada:
value-it=Le entità HTML &copy; &amp; &#8482; funzionano, come le emoji :sparkles: con i loro :rocket: shortcode :tada:

[markdown.kitchen]
value=The whole kitchen sink
value-it=Tutto il campionario
[.guide]
value=Styles, links and pictures mixed in one value, over more than one line: a backslash at the end of a line in the file keeps the line break.
value-it=Stili, collegamenti e immagini mescolati in un valore, su più righe: una barra rovesciata a fine riga nel file mantiene l'a capo.
[.demo]
value=some *formatted* **text.** [*link* ~text~](http://example.com "title text") ***wow*** \
let's try some ^other^ types of ~style~ formatting ![EVO 360]({$embedded}3d.png)\
![Slice](assets:slice.png?height=96)

[markdown.playground]
value=Playground
value-it=Parco giochi
[.guide]
value=Type your own markdown. **WordsMarkdown**, a converter, renders any bound string the way WordsInline renders a key.
value-it=Scrivi il tuo markdown. **WordsMarkdown**, un convertitore, mostra qualsiasi stringa legata come WordsInline mostra una chiave.

; Hyperlinks

[links.links]
value=Tooltips, autolinks and app commands
value-it=Tooltip, autolink e comandi dell'app
[.guide]
value=A link's title becomes a tooltip that follows the pointer. A link in a scheme of your own, such as appcmd:, stays in the app: one handler, registered at startup, hears every link the window renders.
value-it=Il titolo di un collegamento diventa un tooltip che segue il puntatore. Un collegamento con uno schema tuo, come appcmd:, resta nell'app: un solo gestore, registrato all'avvio, riceve ogni collegamento della finestra.
[.demo]
value=Links carry pointer-placed tooltips and *styled* labels: [a **bold** link](https://github.com/pzahra/words "Told you so!"), \
autolinks: <https://github.com>, and custom schemes stay in-app: [ping the app](appcmd:ping "Routed by RegisterGlobalNavigateHandler")
value-it=I collegamenti hanno tooltip sul puntatore ed etichette *decorate*: [un link in **grassetto**](https://github.com/pzahra/words "Te l'avevo detto!"), \
autolink: <https://github.com>, e gli schemi personalizzati restano nell'app: [chiama l'app](appcmd:ping "Instradato da RegisterGlobalNavigateHandler")

[links.report]
value=What the app heard
value-it=Cosa ha sentito l'app
[.guide]
value=The handler counts the app commands, and the view model hands the count and the last link to **Params**, which fills the value's placeholders.
value-it=Il gestore conta i comandi dell'app, e il view model passa il conteggio e l'ultimo collegamento a **Params**, che riempie i segnaposto del valore.
[.demo]
value=The app took **{0}** command(s) so far; the last one was *{1}*
value-it=L'app ha ricevuto **{0}** comandi finora; l'ultimo era *{1}*

; Images

[images.schemes]
value=Every image scheme
value-it=Ogni schema di immagine
[.guide]
value=An image's scheme says where the picture comes from, and its query sizes and colours it. Flip the theme up top: the **dynres:** icon follows, the **staticres:** one keeps what it found when it loaded.
value-it=Lo schema di un'immagine dice da dove viene, e la sua query la dimensiona e la colora. Cambia il tema in alto: l'icona **dynres:** lo segue, quella **staticres:** tiene ciò che ha trovato al caricamento.
[.demo]
value=An embedded asset ![EVO 360]({$embedded}3d.png) at natural size, _
the same scaled down ![EVO 360]({$embedded}3d.png?height=16), _
a file from the Assets folder ![Slice](assets:slice.png?height=48), _
a resource geometry ![star](staticres:StarGeometry?foreground=Goldenrod&height=16) with a foreground option, _
a theme-scoped icon pinned at load ![theme](staticres:ThemeIcon?foreground=staticres:ThemeIconBrush&height=16) beside the same key live through dynres: ![theme](dynres:ThemeIcon?foreground=dynres:ThemeIconBrush&height=16) — its brush a theme resource too, _
a template resource ![heart](staticres:HeartTemplate?height=16) built fresh each time — _
and a missing picture degrades to its alt text: ![lost picture](assets:missing.png)
value-it=Una risorsa incorporata ![EVO 360]({$embedded}3d.png) a grandezza naturale, _
la stessa rimpicciolita ![EVO 360]({$embedded}3d.png?height=16), _
un file dalla cartella Assets ![Slice](assets:slice.png?height=48), _
una geometria dalle risorse ![stella](staticres:StarGeometry?foreground=Goldenrod&height=16) con l'opzione foreground, _
un'icona legata al tema fissata al caricamento ![tema](staticres:ThemeIcon?foreground=staticres:ThemeIconBrush&height=16) accanto alla stessa chiave dal vivo via dynres: ![tema](dynres:ThemeIcon?foreground=dynres:ThemeIconBrush&height=16) — anche il pennello è una risorsa del tema, _
una risorsa template ![cuore](staticres:HeartTemplate?height=16) ricostruita ogni volta — _
e un'immagine mancante degrada nel suo testo alternativo: ![figura perduta](assets:missing.png)

; Format parameters

[parameters.positional]
value=Positional, from a child binding
value-it=Posizionali, da un binding figlio
[.guide]
value=Put bindings inside a **WordsInline** and they fill its numbered placeholders in order, rendering again as they change. Move the slider.
value-it=Metti dei binding dentro un **WordsInline** e riempiono i suoi segnaposto numerati in ordine, ridisegnandosi quando cambiano. Muovi il cursore.
[.demo]
value=You have **{0}** unread messages
value-it=Hai **{0}** messaggi da leggere

[parameters.named]
value=Named, read off an object
value-it=Con nome, letti da un oggetto
[.guide]
value=Hand **Params** an object and named placeholders read its properties, with a format after a colon, as string.Format takes one.
value-it=Passa un oggetto a **Params** e i segnaposto con nome leggono le sue proprietà, con un formato dopo i due punti, come lo prende string.Format.
[.demo]
value=Signed in as **{Name}** since {Since:d}
value-it=Collegato come **{Name}** dal {Since:d}

; Live switching

[live.bound-key]
value=A key the view model picks
value-it=Una chiave scelta dal view model
[.guide]
value=Wrap a binding in **{l:Words}** and its value is the key, looked up whenever it changes and again on every language switch. Flip the theme, then switch the language.
value-it=Avvolgi un binding in **{l:Words}** e il suo valore è la chiave, cercata quando cambia e di nuovo a ogni cambio di lingua. Cambia il tema, poi la lingua.
[.light]
value=The light theme is on: the view model picks this key.
value-it=È attivo il tema chiaro: il view model sceglie questa chiave.
[.dark]
value=The dark theme is on: the view model picks this key.
value-it=È attivo il tema scuro: il view model sceglie questa chiave.

[live.converted]
value=A binding with its own converter
value-it=Un binding con il suo convertitore
[.guide]
value=Wrapped in **{l:Words}**, a binding's own converter runs again on every language switch, not only when its source moves. Move the slider, then switch the language.
value-it=Avvolto in **{l:Words}**, il convertitore di un binding si riesegue a ogni cambio di lingua, non solo quando la sorgente si muove. Muovi il cursore, poi cambia la lingua.
[.demo]
value=The slider reads {0:N0}, formatted by WordsConverter
value-it=Il cursore segna {0:N0}, formattato da WordsConverter
