[markdown.playground]
value=Playground
value-it=Parco giochi
[.guide]
value=Type your own markdown. **WordsMarkdown**, a converter, renders any bound string the way WordsInline renders a key.
value-it=Scrivi il tuo markdown. **WordsMarkdown**, un convertitore, mostra qualsiasi stringa legata come WordsInline mostra una chiave.

; References. They resolve when a key is looked up, before markdown sees the
; value, so every surface shows them. A literal brace is written twice: the
; guidance below shows {{>key} as {>key}.

[references.keys]
value=One key inside another
value-it=Una chiave dentro un'altra
[.guide]
value=Write **{{>key}** in a value and that key's words take its place, in the language showing. Say a thing once — a product name, a menu path — and every value that mentions it agrees, translations included.
value-it=Scrivi **{{>chiave}** in un valore e le parole di quella chiave prendono il suo posto, nella lingua mostrata. Di' una cosa una volta sola — il nome di un prodotto, un percorso di menu — e ogni valore che la cita è d'accordo, traduzioni comprese.
[.demo]
value=This page is **{>topic.references}**, and the next one down the list is **{>topic.links}**.
value-it=Questa pagina è **{>topic.references}**, e la prossima nell'elenco è **{>topic.links}**.

[references.constants]
value=Constants
value-it=Costanti
[.guide]
value=A key that starts with $ is a constant: **{{$name}** splices it in as written, never translated and never looked into. Each twin loads a framework.ini of two constants, which is how one set of words names both.
value-it=Una chiave che inizia con $ è una costante: **{{$nome}** la inserisce così com'è, mai tradotta né espansa. Ogni gemello carica un framework.ini con due costanti, ed è così che le stesse parole nominano entrambi.
[.demo]
value=This is the **{$framework}** twin, and its embedded pictures load from {$embedded}
value-it=Questo è il gemello **{$framework}**, e le sue immagini incorporate si caricano da {$embedded}

[references.relative]
value=Keys named from the one above
value-it=Chiavi nominate da quella sopra
[.guide]
value=A block named **[.title]** nests under the last full header, as this card's own guidance does, and **{{>.title}** inside a value reaches down from the key being shown. A value and its parts stay together.
value-it=Un blocco chiamato **[.title]** si annida sotto l'ultima intestazione completa, come fa la guida di questa scheda, e **{{>.title}** dentro un valore scende dalla chiave mostrata. Un valore e le sue parti restano insieme.

[references.relative.demo]
value=Now reading: *{>.title}* by {>.author}
value-it=In lettura: *{>.title}* di {>.author}
[.title]
value=The Name of the Rose
value-it=Il nome della rosa
[.author]
value=Umberto Eco

[references.circular]
value=A loop, cut
value-it=Un giro, interrotto
[.guide]
value=References nest as deep as you like, but one that comes back round to a key already being shown is cut where the loop closes, marked **# ∞ #**, and reported to **Words.Logger** rather than thrown.
value-it=I riferimenti si annidano quanto vuoi, ma uno che torna a una chiave già in corso viene interrotto dove il giro si chiude, segnato **# ∞ #**, e segnalato a **Words.Logger** invece di sollevare un'eccezione.
[.demo]
