[.guide]
value=Put bindings inside a **WordsInline** and they fill its numbered placeholders in order, rendering again as they change. Move the slider.
value-it=Metti dei binding dentro un **WordsInline** e riempiono i suoi segnaposto numerati in ordine, ridisegnandosi quando cambiano. Muovi il cursore.
value-mt=Poġġi bindings ġewwa **WordsInline** u jimlew il-postijiet numerati tiegħu bl-ordni, u jerġgħu jitpinġew hekk kif jinbidlu. Ċaqlaq is-slider.
