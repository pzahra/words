# Plugin coordinates
pluginVersion=0.1.0
riderPluginId=ai.evosonic.wordsxaml
# The .NET assembly name of the backend plugin (WordsXaml.dll). Its companion WordsXaml.Core.dll is
# copied alongside it — see build.gradle.kts.
dotNetPluginId=WordsXaml

# Debug so the backend .pdb is emitted and breakpoints bind when you attach a debugger.
buildConfiguration=Debug

# runIde downloads and launches its OWN sandbox Rider of this version (NOT your installed Rider). It MUST
# match the JetBrains.ReSharper.SDK version the backend is compiled against (see WordsXaml.csproj), or the
# host will refuse to load the backend assemblies.
riderSdkVersion=2025.3.4

org.gradle.jvmargs=-Xmx1024m
org.gradle.configuration-cache=false
